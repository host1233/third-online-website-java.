<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>checker</title>
</head>
<body>
    <script>
        let num=Number(prompt("enter number"));
        if(num%5==0){
            alert(num+" this number is divisible by 5");
            console.log(num+" this number is divisible by 5");
        }
        else{
            alert(num+" this number is not  divisible by 5");
            console.log(num+" this number is not  divisible by 5");

        }
    </script>
</body>
</html>
