<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>decision control</title>
    <h1>if else if</h1>
</head>
<body>
    <script>
let a=Number(prompt("enter your marks"));
if(a >=90){
    alert("grade A");
    console.log(" grade A");
    
}
else if(a>=70){
        alert("grade B");
console.log(" grade B");
    } 
    else{
        alert("your grade c");
        console.log(" grade c");
    }
    </script>
</body>
</html>
